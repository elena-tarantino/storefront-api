<!doctype html>
<meta charset="utf-8">
<title>storefront-api status</title>
<h1>storefront-api deploy status</h1>
<p>Build info is regenerated on each deploy.</p>
<pre id="out">loading build-info.json...</pre>
<script>
fetch("build-info.json").then(r=>r.json()).then(d=>{
  document.getElementById("out").textContent = JSON.stringify(d, null, 2);
});
</script>
